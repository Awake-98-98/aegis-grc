[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-grc"
version = "0.1.0"
description = "AegisGRC - security risk consulting workbench"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Awake-98-98" }]
dependencies = [
    "fastapi==0.151.0",
    "uvicorn[standard]==0.54.0",
    "SQLAlchemy==2.1.5",
    "Jinja2==3.1.6",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
]

[project.scripts]
aegis = "aegis.cli:main"

[tool.setuptools.packages.find]
include = ["aegis*"]

[tool.setuptools.package-data]
aegis = ["templates/**/*.html", "static/**/*", "db/migrations/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
